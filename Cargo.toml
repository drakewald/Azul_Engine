[package]
name = "azul-engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { version = "0.2.87", features = ["serde-serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.4"
# MODIFIED: Removed the incorrect feature flag from this line.
rand = { version = "0.8.5", features = ["serde"] }
rand_distr = "0.4"

# NEW: Added getrandom as a direct dependency with the "js" feature for Wasm support.
getrandom = { version = "0.2", features = ["js"] }

# Pure-Rust deps available in all builds (including Wasm)
anyhow = { version = "1.0" }
candle-core = { version = "0.8" }
candle-nn = { version = "0.8" }
rustc-hash = { version = "1.1" }

# Native-only dependencies are optional
clap = { version = "4.0", features = ["derive"], optional = true }
chrono = { version = "0.4", optional = true }
rayon = { version = "1.5", optional = true }
serde_json = { version = "1.0", optional = true }
zstd = { version = "0.13", optional = true }
smallvec = { version = "1.11", optional = true }

# Wasm-only dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["console"] }
# Force the wasm_js feature on getrandom 0.3 (pulled in transitively by candle-core)
getrandom = { version = "0.3", features = ["wasm_js"] }


[features]
# The "native" feature enables all dependencies not compatible with Wasm.
native = ["clap", "chrono", "rayon", "serde_json", "zstd", "smallvec"]

# The headless and train binaries require the "native" feature to be enabled.
[[bin]]
name = "headless"
required-features = ["native"]

[[bin]]
name = "train"
required-features = ["native"]

[[bin]]
name = "replay"
required-features = ["native"]

[[bin]]
name = "bench_nn"
required-features = ["native"]

[[bin]]
name = "bootstrap"
required-features = ["native"]
